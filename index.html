<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YAS LAB | Meeting Minutes</title>
<style>
:root{--ink:#17212b;--muted:#66727d;--line:#e5eaec;--paper:#fff;--bg:#f6f8f8;--accent:#0b7285;--accent-dark:#075968;--soft:#e8f4f3;--danger:#b42318;--success:#18794e}
*{box-sizing:border-box}html{overflow-x:hidden}body{margin:0;min-width:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}button,input{font:inherit}button{cursor:pointer}a{color:inherit}
.app{width:min(1120px,calc(100% - 40px));margin:0 auto;padding:42px 0 64px}.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:34px}.brand{font-weight:800;letter-spacing:.08em;font-size:18px}.brand-sub{margin-top:6px;color:var(--muted);font-size:13px;letter-spacing:.02em}.page-title{margin:0;font-size:36px;line-height:1.2;letter-spacing:-.03em}.page-subtitle{margin:8px 0 0;color:var(--muted)}
.primary-btn,.secondary-btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;transition:.2s}.primary-btn{background:var(--accent);color:#fff;box-shadow:0 5px 14px rgba(11,114,133,.18)}.primary-btn:hover{background:var(--accent-dark);transform:translateY(-1px)}.secondary-btn{background:var(--soft);color:var(--accent-dark)}.secondary-btn:hover{background:#d9eeec}.primary-btn:disabled,.secondary-btn:disabled{opacity:.55;cursor:wait;transform:none}
.search-row{display:flex;gap:12px;margin-bottom:22px}.search-wrap{position:relative;flex:1}.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#829096;pointer-events:none}.search-input{width:100%;height:48px;padding:0 16px 0 44px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none;box-shadow:0 3px 12px rgba(30,50,55,.04)}.search-input:focus{border-color:#8cbfc6;box-shadow:0 0 0 3px rgba(11,114,133,.08)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:38px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px}.stat-value{font-size:30px;font-weight:800;line-height:1}.stat-label{margin-top:8px;color:var(--muted);font-size:14px}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.section-heading h2{margin:0;font-size:21px}.refresh-button{padding:8px 12px;border:0;border-radius:9px;background:transparent;color:var(--accent);font-weight:700}.refresh-button:hover{background:var(--soft)}#fileList{display:grid;gap:12px}
.meeting-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px;transition:border-color .2s,box-shadow .2s}.meeting-card:hover{border-color:#c6dadd;box-shadow:0 8px 22px rgba(30,50,55,.06)}.meeting-main{min-width:0}.meeting-title{margin:0;font-size:18px;line-height:1.45;overflow-wrap:anywhere}.meeting-date{margin-top:5px;color:var(--muted);font-size:14px}.meeting-meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:13px;color:var(--muted);font-size:14px}.meeting-meta span{overflow-wrap:anywhere}.meeting-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:18px;padding-top:15px;border-top:1px solid var(--line)}.file-counts{display:flex;flex-wrap:wrap;gap:5px;color:var(--muted);font-size:13px}.file-counts .separator{color:#aab4b8}.view-link{border:0;background:transparent;color:var(--accent);font-weight:800;padding:7px 0;white-space:nowrap}.empty-message{margin:0;padding:42px 20px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #cfdadc;border-radius:14px}.error{color:var(--danger)}.success{color:var(--success)}
.pagination{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:22px}.pagination button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 12px}.pagination button:disabled{opacity:.45;cursor:not-allowed}.page-info{min-width:100px;text-align:center;color:var(--muted);font-size:14px}
.modal-backdrop{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(20,32,37,.48)}.modal-backdrop.open{display:flex}.modal{width:min(620px,100%);max-height:min(88vh,760px);overflow:auto;background:#fff;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.2)}.modal-header{display:flex;justify-content:space-between;gap:16px;padding:22px 24px;border-bottom:1px solid var(--line)}.modal-header h2{margin:0;font-size:21px}.close-btn{width:34px;height:34px;border:0;border-radius:8px;background:#f2f5f5;color:var(--muted);font-size:20px}.modal-body{padding:22px 24px}.field{display:grid;gap:7px;margin-bottom:15px}.field label{font-size:14px;font-weight:700}.field input[type=text],.field input[type=datetime-local]{width:100%;height:44px;padding:0 12px;border:1px solid #c8d3d6;border-radius:9px;outline:none;background:#fff}.field input:focus{border-color:#8cbfc6;box-shadow:0 0 0 3px rgba(11,114,133,.07)}.field input[type=file]{width:100%;padding:11px;border:1px dashed #a9bdc1;border-radius:9px;background:#f8fbfb}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.status{min-height:20px;margin-top:10px;font-size:14px;font-weight:700}.detail-grid{display:grid;gap:12px}.detail-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.detail-meta-item{padding:12px;background:#f7f9f9;border-radius:10px;min-width:0}.detail-meta-label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.detail-meta-value{display:block;font-size:14px;font-weight:700;overflow-wrap:anywhere}.file-item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-top:1px solid var(--line)}.file-item:first-child{border-top:0}.file-name{min-width:0;overflow-wrap:anywhere}.file-open{flex:0 0 auto;text-decoration:none;color:var(--accent);font-weight:800}
@media(max-width:700px){.app{width:min(100% - 24px,1120px);padding:24px 0 42px}.topbar{align-items:flex-start;flex-direction:column;gap:18px;margin-bottom:24px}.topbar .primary-btn{width:100%}.page-title{font-size:30px}.search-row{margin-bottom:16px}.stats{gap:10px;margin-bottom:28px}.stat{padding:17px 14px}.stat-value{font-size:24px}.stat-label{font-size:12px;line-height:1.35}.meeting-card{padding:18px 16px}.meeting-meta{display:block}.meeting-meta span+span:before{content:" · ";color:#aab4b8}.meeting-footer{align-items:center}.view-link{padding:7px 0}.detail-meta{grid-template-columns:1fr 1fr}.modal-backdrop{padding:10px;align-items:flex-end}.modal{max-height:92vh;border-radius:16px 16px 10px 10px}.modal-header,.modal-body{padding-left:18px;padding-right:18px}.modal-actions{flex-direction:column-reverse}.modal-actions button{width:100%;min-height:44px}}
@media(max-width:430px){.app{width:calc(100% - 20px);padding-top:18px}.brand{font-size:16px}.page-title{font-size:26px}.page-subtitle{font-size:14px}.search-input{height:46px}.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.stat{padding:14px 9px;text-align:center}.stat-value{font-size:21px}.stat-label{font-size:11px}.section-heading h2{font-size:19px}.meeting-title{font-size:17px}.meeting-date{font-size:13px}.meeting-meta{font-size:13px;line-height:1.6}.meeting-footer{margin-top:15px;padding-top:13px}.file-counts{font-size:12px}.pagination{gap:10px}.page-info{min-width:85px}.detail-meta{grid-template-columns:1fr}.file-item{align-items:flex-start;flex-direction:column;gap:7px}.file-open{padding:5px 0}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
<div><div class="brand">YAS LAB</div><div class="brand-sub">Meeting Minutes</div><div style="margin-top:20px"><h1 class="page-title">Lab Meeting Archive</h1><p class="page-subtitle">集中管理實驗室會議紀錄與相關附件</p></div></div>
<button class="primary-btn" type="button" id="newMeetingBtn">＋ New Meeting</button>
</header>
<div class="search-row"><div class="search-wrap"><span class="search-icon">⌕</span><input class="search-input" id="searchInput" type="search" placeholder="Search meetings..." autocomplete="off"></div></div>
<section class="stats" aria-label="Meeting statistics"><div class="stat"><div class="stat-value" id="totalCount">0</div><div class="stat-label">Meetings</div></div><div class="stat"><div class="stat-value" id="yearCount">0</div><div class="stat-label">This Year</div></div><div class="stat"><div class="stat-value" id="monthCount">0</div><div class="stat-label">This Month</div></div></section>
<section><div class="section-heading"><h2>Recent Meetings</h2><button class="refresh-button" type="button" id="refreshBtn">Refresh</button></div><div id="fileList" aria-live="polite">Loading...</div><div class="pagination" id="pagination" hidden><button type="button" id="previousPage">Previous</button><span class="page-info" id="pageInfo"></span><button type="button" id="nextPage">Next</button></div></section>
</div>

<div class="modal-backdrop" id="newMeetingModal" aria-hidden="true"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="newMeetingTitle"><div class="modal-header"><h2 id="newMeetingTitle">New Meeting</h2><button class="close-btn" type="button" data-close="newMeetingModal" aria-label="Close">×</button></div><div class="modal-body"><form id="uploadForm"><div class="field"><label for="uploader">Uploader Name</label><input type="text" id="uploader" autocomplete="name" required></div><div class="field"><label for="meetingTitle">Meeting Title or Topic</label><input type="text" id="meetingTitle" required></div><div class="field"><label for="meetingTime">Meeting Date and Time</label><input type="datetime-local" id="meetingTime" required></div><div class="field"><label for="meetingLocation">Meeting Location</label><input type="text" id="meetingLocation" required></div><div class="field"><label for="minutesFile">會議記錄 / Meeting Minutes</label><input type="file" id="minutesFile" required></div><div class="field"><label for="attachmentFiles">相關附件 / Related Attachments</label><input type="file" id="attachmentFiles" multiple></div><div class="status" id="status" role="status" aria-live="polite"></div><div class="modal-actions"><button class="secondary-btn" type="button" data-close="newMeetingModal">Cancel</button><button class="primary-btn" type="submit" id="submitBtn">Upload Meeting</button></div></form></div></div></div>
<div class="modal-backdrop" id="detailModal" aria-hidden="true"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="modal-header"><h2 id="detailTitle">Meeting</h2><button class="close-btn" type="button" data-close="detailModal" aria-label="Close">×</button></div><div class="modal-body" id="detailBody"></div></div></div>

<script>
const scriptURL='https://script.google.com/macros/s/AKfycbw444IJS-jt4bTlspnVbDTwnGfh7OHL3t9oArf6vFILegPgWiInz5pukmbg_UbbVfREeA/exec';
const pageSize=10;let meetings=[];let filteredMeetings=[];let currentPage=1;
const $=id=>document.getElementById(id);
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function formatDate(value){const d=new Date(value);if(Number.isNaN(d.getTime()))return 'Date unavailable';const pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} · ${pad(d.getHours())}:${pad(d.getMinutes())}`}
function sortMeetings(){meetings.sort((a,b)=>new Date(b.meetingTime)-new Date(a.meetingTime))}
function updateStats(){const now=new Date();$('totalCount').textContent=meetings.length;$('yearCount').textContent=meetings.filter(m=>{const d=new Date(m.meetingTime);return d.getFullYear()===now.getFullYear()}).length;$('monthCount').textContent=meetings.filter(m=>{const d=new Date(m.meetingTime);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()}).length}
function applySearch(){const q=$('searchInput').value.trim().toLowerCase();filteredMeetings=meetings.filter(m=>{if(!q)return true;const files=(m.attachments||[]).map(a=>a.name).join(' ');return [m.title,m.uploader,m.location,m.minutesName,files].some(v=>String(v??'').toLowerCase().includes(q))});currentPage=1;renderMeetings()}
function renderMeetings(){const totalPages=Math.max(1,Math.ceil(filteredMeetings.length/pageSize));if(currentPage>totalPages)currentPage=totalPages;const start=(currentPage-1)*pageSize;const rows=filteredMeetings.slice(start,start+pageSize);if(!rows.length){$('fileList').innerHTML='<p class="empty-message">No meetings found.<br><small>Try another search or create a new meeting.</small></p>'}else{$('fileList').innerHTML=rows.map(m=>`<article class="meeting-card"><div class="meeting-main"><h3 class="meeting-title">${escapeHtml(m.title||'Untitled Meeting')}</h3><div class="meeting-date">${escapeHtml(formatDate(m.meetingTime))}</div><div class="meeting-meta"><span>${escapeHtml(m.uploader||'Unknown')}</span><span>${escapeHtml(m.location||'No location')}</span></div><div class="meeting-footer"><div class="file-counts"><span>${(m.minutesName||'Meeting Minutes')?'1 minute':'0 minutes'}</span><span class="separator">·</span><span>${(m.attachments||[]).length} attachment${(m.attachments||[]).length===1?'':'s'}</span></div><button class="view-link" type="button" data-meeting-id="${escapeHtml(m.id)}">View →</button></div></div></article>`).join('');document.querySelectorAll('[data-meeting-id]').forEach(btn=>btn.addEventListener('click',()=>openDetail(btn.dataset.meetingId)))}$('pagination').hidden=filteredMeetings.length<=pageSize;$('pageInfo').textContent=`Page ${currentPage} of ${totalPages}`;$('previousPage').disabled=currentPage===1;$('nextPage').disabled=currentPage===totalPages}
async function loadFiles(){$('fileList').textContent='Loading...';$('refreshBtn').disabled=true;try{const response=await fetch(scriptURL);if(!response.ok)throw new Error('Unable to load meetings');const result=await response.json();if(result.status!=='success')throw new Error(result.message||'Unable to load meetings');meetings=result.meetings||[];sortMeetings();updateStats();applySearch()}catch(error){$('fileList').innerHTML=`<p class="empty-message error">${escapeHtml(error.message)}</p>`}finally{$('refreshBtn').disabled=false}}
function openModal(id){$(id).classList.add('open');$(id).setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}function closeModal(id){$(id).classList.remove('open');$(id).setAttribute('aria-hidden','true');document.body.style.overflow=''}
function openDetail(id){const m=meetings.find(x=>String(x.id)===String(id));if(!m)return;$('detailTitle').textContent=m.title||'Meeting';const attachments=m.attachments||[];$('detailBody').innerHTML=`<div class="detail-grid"><div class="detail-meta"><div class="detail-meta-item"><span class="detail-meta-label">Date & Time</span><span class="detail-meta-value">${escapeHtml(formatDate(m.meetingTime))}</span></div><div class="detail-meta-item"><span class="detail-meta-label">Uploader</span><span class="detail-meta-value">${escapeHtml(m.uploader||'—')}</span></div><div class="detail-meta-item"><span class="detail-meta-label">Location</span><span class="detail-meta-value">${escapeHtml(m.location||'—')}</span></div></div><div><strong>Meeting Files</strong><div class="file-item"><span class="file-name">${escapeHtml(m.minutesName||'Meeting Minutes')}</span><a class="file-open" href="${escapeHtml(m.minutesUrl)}" target="_blank" rel="noopener noreferrer">Open →</a></div>${attachments.map(a=>`<div class="file-item"><span class="file-name">${escapeHtml(a.name)}</span><a class="file-open" href="${escapeHtml(a.url)}" target="_blank" rel="noopener noreferrer">Open →</a></div>`).join('')}</div></div>`;openModal('detailModal')}
async function readFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=e=>resolve({name:file.name,type:file.type,base64:e.target.result.split(',')[1]});reader.onerror=()=>reject(new Error(`Unable to read file: ${file.name}`));reader.readAsDataURL(file)})}
$('uploadForm').addEventListener('submit',async e=>{e.preventDefault();const minutesFile=$('minutesFile').files[0];if(!minutesFile)return;$('status').textContent='Uploading, please wait...';$('submitBtn').disabled=true;try{const [minutesFileData,...attachments]=await Promise.all([readFile(minutesFile),...Array.from($('attachmentFiles').files).map(readFile)]);const payload={uploader:$('uploader').value.trim(),meetingTitle:$('meetingTitle').value.trim(),meetingTime:$('meetingTime').value,meetingLocation:$('meetingLocation').value.trim(),minutesFile:minutesFileData,attachments};const response=await fetch(scriptURL,{method:'POST',body:JSON.stringify(payload)});const result=await response.json();if(result.status!=='success')throw new Error(result.message||'Upload failed');$('status').innerHTML='<span class="success">Upload successful.</span>';$('uploadForm').reset();setTimeout(()=>{closeModal('newMeetingModal');$('status').textContent='';loadFiles()},500)}catch(error){$('status').innerHTML=`<span class="error">${escapeHtml(error.message)}</span>`}finally{$('submitBtn').disabled=false}});
$('newMeetingBtn').addEventListener('click',()=>openModal('newMeetingModal'));$('refreshBtn').addEventListener('click',loadFiles);$('searchInput').addEventListener('input',applySearch);$('previousPage').addEventListener('click',()=>{if(currentPage>1){currentPage--;renderMeetings()}});$('nextPage').addEventListener('click',()=>{const total=Math.ceil(filteredMeetings.length/pageSize);if(currentPage<total){currentPage++;renderMeetings()}});document.querySelectorAll('[data-close]').forEach(btn=>btn.addEventListener('click',()=>closeModal(btn.dataset.close)));document.querySelectorAll('.modal-backdrop').forEach(backdrop=>backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeModal(backdrop.id)}));document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-backdrop.open').forEach(m=>closeModal(m.id))});loadFiles();
</script>
</body>
</html>
