<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f766e">
<title>YAS LAB | Meeting Minutes</title>
<style>
:root{--ink:#17212b;--muted:#6b7780;--line:#e5e9eb;--paper:#fff;--bg:#f6f8f8;--accent:#0f766e;--accent-dark:#0b5f59;--soft:#e9f5f3;--shadow:0 10px 30px rgba(24,42,45,.06)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}button,input{font:inherit}button{cursor:pointer}.container{max-width:1100px;margin:auto;padding:0 24px}
.header{border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(12px);position:sticky;top:0;z-index:20}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;letter-spacing:.5px}.brand-name{font-weight:800;letter-spacing:.08em}.brand-sub{font-size:12px;color:var(--muted);margin-top:2px}.hero{padding:52px 0 28px}.eyebrow{font-size:13px;color:var(--accent);font-weight:800;letter-spacing:.1em;text-transform:uppercase}.hero h1{font-size:38px;line-height:1.15;margin:10px 0 8px;letter-spacing:-.03em}.hero p{margin:0;color:var(--muted)}
.toolbar{display:flex;gap:12px;align-items:center;margin:24px 0}.search{position:relative;flex:1}.search span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8b969b}.search input{width:100%;height:46px;padding:0 16px 0 42px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}.search input:focus{border-color:#91c8c3;box-shadow:0 0 0 3px rgba(15,118,110,.08)}.primary{height:46px;padding:0 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700}.primary:hover{background:var(--accent-dark)}.secondary{height:42px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:12px 0 42px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow)}.stat-number{font-size:30px;font-weight:800;letter-spacing:-.03em}.stat-label{color:var(--muted);font-size:13px;margin-top:4px}
.section-title{display:flex;align-items:end;justify-content:space-between;margin-bottom:14px}.section-title h2{font-size:20px;margin:0}.section-title span{font-size:13px;color:var(--muted)}.meeting-list{display:grid;gap:12px}.meeting-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px;transition:box-shadow .2s,transform .2s}.meeting-card:hover{box-shadow:0 12px 28px rgba(24,42,45,.08);transform:translateY(-1px)}.meeting-title{font-size:18px;font-weight:800}.meeting-date{font-size:14px;color:var(--muted);margin-top:6px}.meeting-info{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:13px;margin-top:12px}.meeting-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding-top:14px;border-top:1px solid #f0f2f3}.counts{font-size:13px;color:var(--muted)}.view-link{border:0;background:none;color:var(--accent);font-weight:800;padding:7px 0}.view-link:hover{text-decoration:underline}.empty{background:#fff;border:1px dashed #cfd8da;border-radius:14px;text-align:center;padding:56px 20px;color:var(--muted)}.empty-icon{font-size:30px;margin-bottom:8px}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.pagination{display:flex;justify-content:center;align-items:center;gap:14px;margin:22px 0 48px}.pagination button{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff}.pagination button:disabled{opacity:.45;cursor:not-allowed}.page-info{font-size:13px;color:var(--muted)}
footer{padding:30px 0 42px;color:#98a1a5;font-size:12px;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(13,24,27,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.overlay.open{display:flex}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.18)}.modal-header{display:flex;justify-content:space-between;gap:20px;padding:22px 24px;border-bottom:1px solid var(--line)}.modal-header h2{margin:0;font-size:20px}.close{width:34px;height:34px;border:0;border-radius:8px;background:#f3f5f5;color:#667; font-size:20px}.modal-body{padding:24px}.field{display:grid;gap:7px;margin-bottom:16px}.field label{font-size:13px;font-weight:700}.field input{width:100%;height:44px;border:1px solid #d5dddf;border-radius:9px;padding:0 12px;outline:none}.field input:focus{border-color:#91c8c3;box-shadow:0 0 0 3px rgba(15,118,110,.08)}.file-input{border:1px dashed #b9c8ca!important;height:auto!important;padding:12px!important;background:#fafcfc}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.status{min-height:20px;margin-top:12px;font-size:13px}.success{color:#18794e}.error{color:#b42318}.detail-row{padding:14px 0;border-bottom:1px solid var(--line)}.detail-label{font-size:12px;color:var(--muted);margin-bottom:5px}.detail-value{font-weight:600}.files{display:grid;gap:8px;margin-top:10px}.file-link{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;background:#f7f9f9;border-radius:9px;color:var(--ink);text-decoration:none}.file-link:hover{background:var(--soft);color:var(--accent)}
@media(max-width:680px){.container{padding:0 16px}.nav{height:64px}.hero{padding-top:36px}.hero h1{font-size:30px}.toolbar{align-items:stretch;flex-direction:column}.stats{grid-template-columns:1fr;margin-bottom:32px}.meeting-card{padding:19px}.meeting-bottom{align-items:flex-start;flex-direction:column}.primary{width:100%}.modal{border-radius:14px}.modal-actions{flex-direction:column-reverse}.modal-actions button{width:100%}}
</style>
</head>
<body>
<header class="header"><div class="container nav"><div class="brand"><div class="brand-mark">YAS</div><div><div class="brand-name">YAS LAB</div><div class="brand-sub">Meeting Minutes</div></div></div><button class="primary" type="button" id="newMeetingBtn">＋ New Meeting</button></div></header>
<main class="container">
<section class="hero"><div class="eyebrow">Lab Meeting Archive</div><h1>Meeting Minutes</h1><p>管理實驗室會議紀錄與相關附件。</p></section>
<div class="toolbar"><div class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="Search meetings..." aria-label="Search meetings"></div><button class="primary" type="button" id="newMeetingBtn2">＋ New Meeting</button></div>
<section class="stats"><div class="stat"><div class="stat-number" id="totalCount">—</div><div class="stat-label">Meetings</div></div><div class="stat"><div class="stat-number" id="yearCount">—</div><div class="stat-label">This Year</div></div><div class="stat"><div class="stat-number" id="monthCount">—</div><div class="stat-label">This Month</div></div></section>
<section><div class="section-title"><h2>Recent Meetings</h2><span id="resultCount"></span></div><div id="meetingList" class="meeting-list"><div class="empty">Loading...</div></div><div class="pagination" id="pagination" hidden><button id="previousPage" type="button">Previous</button><span class="page-info" id="pageInfo"></span><button id="nextPage" type="button">Next</button></div></section>
</main><footer>YAS LAB · Meeting Minutes Archive</footer>

<div class="overlay" id="uploadModal" role="dialog" aria-modal="true" aria-labelledby="uploadTitle"><div class="modal"><div class="modal-header"><h2 id="uploadTitle">New Meeting</h2><button class="close" type="button" data-close="uploadModal">×</button></div><div class="modal-body"><form id="uploadForm"><div class="field"><label for="uploader">Uploader Name</label><input id="uploader" type="text" autocomplete="name" required></div><div class="field"><label for="meetingTitle">Meeting Title or Topic</label><input id="meetingTitle" type="text" required></div><div class="field"><label for="meetingTime">Meeting Date and Time</label><input id="meetingTime" type="datetime-local" required></div><div class="field"><label for="meetingLocation">Meeting Location</label><input id="meetingLocation" type="text" required></div><div class="field"><label for="minutesFile">Meeting Minutes</label><input class="file-input" id="minutesFile" type="file" required></div><div class="field"><label for="attachmentFiles">Related Attachments (Multiple)</label><input class="file-input" id="attachmentFiles" type="file" multiple></div><div id="uploadStatus" class="status" role="status" aria-live="polite"></div><div class="modal-actions"><button class="secondary" type="button" data-close="uploadModal">Cancel</button><button class="primary" id="submitBtn" type="submit">Upload Meeting</button></div></form></div></div></div>

<div class="overlay" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="modal"><div class="modal-header"><h2 id="detailTitle">Meeting</h2><button class="close" type="button" data-close="detailModal">×</button></div><div class="modal-body" id="detailBody"></div></div></div>

<script>
const scriptURL='https://script.google.com/macros/s/AKfycbw444IJS-jt4bTlspnVbDTwnGfh7OHL3t9oArf6vFILegPgWiInz5pukmbg_UbbVfREeA/exec';
const pageSize=10;let meetings=[];let filteredMeetings=[];let currentPage=1;
const $=id=>document.getElementById(id);
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function dateObj(value){const d=new Date(value);return Number.isNaN(d.getTime())?null:d;}
function formatDate(value){const d=dateObj(value);if(!d)return 'Date unknown';return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function updateStats(){const now=new Date();$('totalCount').textContent=meetings.length;$('yearCount').textContent=meetings.filter(m=>{const d=dateObj(m.meetingTime);return d&&d.getFullYear()===now.getFullYear()}).length;$('monthCount').textContent=meetings.filter(m=>{const d=dateObj(m.meetingTime);return d&&d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()}).length;}
function render(){const totalPages=Math.max(1,Math.ceil(filteredMeetings.length/pageSize));if(currentPage>totalPages)currentPage=totalPages;const start=(currentPage-1)*pageSize;const list=filteredMeetings.slice(start,start+pageSize);$('resultCount').textContent=filteredMeetings.length?`${filteredMeetings.length} meetings`:'';if(!list.length){$('meetingList').innerHTML='<div class="empty"><div class="empty-icon">▱</div><strong>No meetings found</strong><span>Try another search or create a new meeting.</span></div>';$('pagination').hidden=true;return;}$('meetingList').innerHTML=list.map((m,i)=>{const attachments=m.attachments||[];return `<article class="meeting-card"><div class="meeting-title">${escapeHtml(m.title||'Untitled Meeting')}</div><div class="meeting-date">${escapeHtml(formatDate(m.meetingTime))}</div><div class="meeting-info"><span>👤 ${escapeHtml(m.uploader||'Unknown')}</span><span>📍 ${escapeHtml(m.location||'—')}</span></div><div class="meeting-bottom"><div class="counts">📄 1 minutes &nbsp;&nbsp; 📎 ${attachments.length} attachment${attachments.length===1?'':'s'}</div><button class="view-link" type="button" data-index="${start+i}">View Meeting →</button></div></article>`}).join('');$('pagination').hidden=totalPages<=1;$('pageInfo').textContent=`Page ${currentPage} of ${totalPages}`;$('previousPage').disabled=currentPage===1;$('nextPage').disabled=currentPage===totalPages;document.querySelectorAll('.view-link').forEach(b=>b.addEventListener('click',()=>openDetail(filteredMeetings[Number(b.dataset.index)])));}
function applySearch(){const q=$('searchInput').value.trim().toLowerCase();filteredMeetings=meetings.filter(m=>!q||[m.title,m.uploader,m.location,m.minutesName,...(m.attachments||[]).map(a=>a.name)].some(v=>String(v||'').toLowerCase().includes(q)));currentPage=1;render();}
function openModal(id){$(id).classList.add('open');document.body.style.overflow='hidden';}function closeModal(id){$(id).classList.remove('open');if(!document.querySelector('.overlay.open'))document.body.style.overflow='';}
function openDetail(m){if(!m)return;$('detailTitle').textContent=m.title||'Meeting';const attachments=m.attachments||[];$('detailBody').innerHTML=`<div class="detail-row"><div class="detail-label">Date & Time</div><div class="detail-value">${escapeHtml(formatDate(m.meetingTime))}</div></div><div class="detail-row"><div class="detail-label">Uploader</div><div class="detail-value">${escapeHtml(m.uploader||'—')}</div></div><div class="detail-row"><div class="detail-label">Location</div><div class="detail-value">${escapeHtml(m.location||'—')}</div></div><div class="detail-row"><div class="detail-label">Meeting Minutes</div><div class="files"><a class="file-link" href="${escapeHtml(m.minutesUrl)}" target="_blank" rel="noopener noreferrer"><span>📄 ${escapeHtml(m.minutesName||'Meeting Minutes')}</span><span>Open ↗</span></a></div></div><div class="detail-row"><div class="detail-label">Attachments (${attachments.length})</div><div class="files">${attachments.length?attachments.map(a=>`<a class="file-link" href="${escapeHtml(a.url)}" target="_blank" rel="noopener noreferrer"><span>📎 ${escapeHtml(a.name)}</span><span>Open ↗</span></a>`).join(''):'<span class="detail-value">No attachments</span>'}</div></div>`;openModal('detailModal');}
function readFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=e=>resolve({name:file.name,type:file.type,base64:e.target.result.split(',')[1]});r.onerror=()=>reject(new Error(`Unable to read file: ${file.name}`));r.readAsDataURL(file);});}
async function loadMeetings(){ $('meetingList').innerHTML='<div class="empty">Loading...</div>';try{const response=await fetch(scriptURL);if(!response.ok)throw new Error('Unable to load meetings');const result=await response.json();if(result.status!=='success')throw new Error(result.message||'Unable to load meetings');meetings=result.meetings||[];meetings.sort((a,b)=>(dateObj(b.meetingTime)?.getTime()||0)-(dateObj(a.meetingTime)?.getTime()||0));updateStats();applySearch();}catch(error){$('meetingList').innerHTML=`<div class="empty"><strong>Unable to load meetings</strong><span class="error">${escapeHtml(error.message)}</span></div>`;}}
$('searchInput').addEventListener('input',applySearch);$('previousPage').addEventListener('click',()=>{if(currentPage>1){currentPage--;render();}});$('nextPage').addEventListener('click',()=>{if(currentPage<Math.ceil(filteredMeetings.length/pageSize)){currentPage++;render();}});$('newMeetingBtn').addEventListener('click',()=>openModal('uploadModal'));$('newMeetingBtn2').addEventListener('click',()=>openModal('uploadModal'));
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeModal(b.dataset.close)));document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeModal(o.id)}));document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.overlay.open').forEach(o=>closeModal(o.id));});
$('uploadForm').addEventListener('submit',async e=>{e.preventDefault();const minutes=$('minutesFile').files[0];if(!minutes)return;const btn=$('submitBtn'),status=$('uploadStatus');btn.disabled=true;status.className='status';status.textContent='Uploading files, please wait...';try{const [minutesFile,...attachments]=await Promise.all([readFile(minutes),...Array.from($('attachmentFiles').files).map(readFile)]);const payload={uploader:$('uploader').value.trim(),meetingTitle:$('meetingTitle').value.trim(),meetingTime:$('meetingTime').value,meetingLocation:$('meetingLocation').value.trim(),minutesFile,attachments};const response=await fetch(scriptURL,{method:'POST',body:JSON.stringify(payload)});const result=await response.json();if(result.status!=='success')throw new Error(result.message||'Upload failed');status.className='status success';status.textContent='Meeting uploaded successfully.';$('uploadForm').reset();await loadMeetings();setTimeout(()=>closeModal('uploadModal'),500);}catch(error){status.className='status error';status.textContent=error.message||'Upload failed.';}finally{btn.disabled=false;}});
loadMeetings();
</script>
</body>
</html>
